# Site identity and public URLs.
title: "Shunyuan Zheng (郑顺源)'s Homepage"
name: "Shunyuan Zheng"
description: "Shunyuan Zheng (郑顺源)'s Homepage"
locale: en-US
url: https://shunyuanzheng.github.io
baseurl: ""
timezone: America/Los_Angeles

author:
  name: "Shunyuan Zheng"
  avatar: avatar.jpg
  email: sawyer0503@hit.edu.cn
  googlescholar: https://scholar.google.com/citations?user=nAHH79oAAAAJ
  github: ShunyuanZheng

# The homepage uses Liquid data and Markdown; GPS-Gaussian.html is copied as-is.
data_dir: publications
layouts_dir: layouts
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  # Template and data sources are consumed by Jekyll, not published as assets.
  - publications
  - layouts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - docs
  - scripts
  - vendor
  - node_modules
  - .bundle
  - .sass-cache
  - .jekyll-cache
